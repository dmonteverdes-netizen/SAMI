          {
            "@type": "Question",
            "name": "¿Cómo ayuda SAMI a mi MYPE a acceder a créditos bancarios?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "SAMI organiza de forma automática tus boletas, facturas y flujo de ventas verificado ante SUNAT. Con tu consentimiento explícito, transmite este expediente de salud tributaria a entidades financieras aliadas para calificar a préstamos con menores tasas."

          },
          {
            "@type": "Question",
            "name": "¿Cómo calculo el IGV y Renta MYPE en Perú?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "En el Régimen MYPE Tributario, la tasa de impuesto a la renta es del 1% sobre ingresos netos mensuales (hasta 300 UIT) y el IGV es del 18% con crédito fiscal por compras formales."
            }
          },
          {
            "@type": "Question",
            "name": "¿SAMI presta dinero directamente a las MYPEs?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. SAMI es una plataforma B2B de ordenamiento financiero y transporte de datos que empaqueta tus datos fiscales verificados para presentarlos a entidades financieras y fintechs aliadas con tu previo consentimiento."
